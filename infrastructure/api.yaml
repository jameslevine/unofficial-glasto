AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Unofficial Glasto — API Gateway + Lambda.

Parameters:
  Environment:
    Type: String
    AllowedValues: [dev, prod]
  TableName:
    Type: String
  CognitoUserPoolId:
    Type: String
    Default: ''
  CognitoClientId:
    Type: String
    Default: ''

Resources:
  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub glasto-api-${Environment}
      CodeUri: ../backend/dist
      Handler: index.handler
      Runtime: nodejs22.x
      Timeout: 15
      MemorySize: 512
      Architectures: [arm64]
      Environment:
        Variables:
          TABLE_NAME: !Ref TableName
          COGNITO_USER_POOL_ID: !Ref CognitoUserPoolId
          COGNITO_CLIENT_ID: !Ref CognitoClientId
          NODE_OPTIONS: --enable-source-maps
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref TableName
      Events:
        Api:
          Type: Api
          Properties:
            Path: /{proxy+}
            Method: ANY

Outputs:
  ApiEndpoint:
    Value: !Sub https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod
