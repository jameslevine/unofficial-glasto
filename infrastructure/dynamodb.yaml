AWSTemplateFormatVersion: '2010-09-09'
Description: Unofficial Glasto — single-table DynamoDB schema.

Parameters:
  Environment:
    Type: String
    AllowedValues: [dev, prod]

Resources:
  Table:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub glasto-${Environment}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: GSI1PK
          AttributeType: S
        - AttributeName: GSI1SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: gsi1
          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH
            - AttributeName: GSI1SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true

Outputs:
  TableName:
    Value: !Ref Table
    Export:
      Name: !Sub glasto-${Environment}-table-name
